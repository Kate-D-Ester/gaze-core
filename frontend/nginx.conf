server {
  listen 4001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress local vision runtimes/models as well as ordinary scripts.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css application/json application/wasm application/octet-stream;


  location = /runtime-config.js {
    alias /tmp/runtime-config.js;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
