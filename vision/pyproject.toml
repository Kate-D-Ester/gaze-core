[project]
name = "gaze-viewer-vision"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["ultralytics==8.4.173"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]
